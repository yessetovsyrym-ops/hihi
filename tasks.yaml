apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  workspaces:
    - name: source
  steps:
    - name: install-and-build
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        npm install
        npm run build
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: node:18
      workingDir: $(workspaces.source.path)
      script: |
        npx jasmine
