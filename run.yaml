apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: web-app-pipeline-run-
spec:
  pipelineRef:
    name: web-app-pipeline
  params:
    - name: repo-url
      value: https://github.com/yessetovsyrym-ops/hihi
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
